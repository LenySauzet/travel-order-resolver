services:
  backend:
    build: .
    container_name: travel-resolver-api
    ports:
      - '8000:8000'
    command:
      [
        'uv',
        'run',
        'uvicorn',
        'backend.app.main:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
      ]
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    build: .
    container_name: travel-resolver-front
    ports:
      - '8501:8501'
    command:
      [
        'uv',
        'run',
        'streamlit',
        'run',
        'frontend/app.py',
        '--server.address',
        '0.0.0.0',
        '--server.port',
        '8501',
      ]
    volumes:
      - .:/app
    depends_on:
      - backend
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.20
    container_name: neo4j-gtfs
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - ./Export_OpenData_SNCF_GTFS_NewTripId:/var/lib/neo4j/import

volumes:
  neo4j_data:
